<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAKAAR — Login</title>
  <meta name="description" content="Login to AAKAAR — your gateway to handcrafted Dhokra art from master artisans across India." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:        #F5EFE6;
      --brown-dark:   #2C1810;
      --golden-bg:    #9A7B3C;
      --golden-card:  #A07D3A;
      --text-primary: #1F110A;
      --text-muted:   rgba(255,255,255,0.65);
      --radius-input: 12px;
      --transition:   0.25s ease;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Page wrapper ── */
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--cream);
    }

    /* ── Hero Image ── */
    .login-hero {
      width: 100%;
      max-width: 520px;
      height: 320px;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
    }
    .login-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: sepia(40%) brightness(0.88);
      display: block;
    }
    /* Logo overlay on hero */
    .login-hero-logo {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-decoration: none;
    }
    .login-hero-logo img {
      height: 46px;
      width: auto;
      filter: none;
      object-fit: contain;
    }
    .login-hero-logo span {
      font-family: 'Playfair Display', serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
      line-height: 1;
    }

    /* ── Login Card ── */
    .login-card {
      width: 100%;
      max-width: 520px;
      background: linear-gradient(160deg, #A07D3A 0%, #7A5E28 100%);
      border-radius: 28px 28px 0 0;
      margin-top: -32px;
      padding: 36px 32px 48px;
      position: relative;
      z-index: 2;
      flex: 1;
    }

    /* ── Welcome heading ── */
    .login-heading {
      font-family: 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 400;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.2;
    }
    .login-heading strong {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 700;
    }
    .login-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 32px;
    }

    /* ── Form fields ── */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .form-group input {
      width: 100%;
      height: 50px;
      border-radius: var(--radius-input);
      border: none;
      background: rgba(255,255,255,0.92);
      padding: 0 16px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      outline: none;
      transition: box-shadow var(--transition);
    }
    .form-group input:focus {
      box-shadow: 0 0 0 2.5px rgba(255,255,255,0.7);
      background: #fff;
    }
    .form-group input::placeholder {
      color: rgba(44,24,16,0.3);
    }

    /* ── CTA Button ── */
    .login-cta {
      width: 100%;
      height: 52px;
      border-radius: 40px;
      background: var(--brown-dark);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      margin-bottom: 32px;
      transition: all var(--transition);
      letter-spacing: 0.01em;
    }
    .login-cta:hover {
      background: #1a0e08;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    .login-cta:active { transform: translateY(0); }

    /* ── Divider ── */
    .login-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .login-divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.25);
    }
    .login-divider-text {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      white-space: nowrap;
      font-weight: 500;
    }

    /* ── Role buttons ── */
    .login-roles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .role-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 18px 12px;
      background: rgba(255,255,255,0.92);
      border: none;
      border-radius: 18px;
      cursor: pointer;
      transition: all var(--transition);
      font-family: 'Inter', sans-serif;
      text-decoration: none;
    }
    .role-btn:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .role-btn:active { transform: translateY(0); }
    .role-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brown-dark);
    }
    .role-icon svg { width: 26px; height: 26px; }
    .role-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--brown-dark);
      text-align: center;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="login-page">

    <!-- ── Hero Image with Logo ── -->
    <div class="login-hero">
      <img src="src/assets/craft5.jpg" alt="Artisan hands at work" fetchpriority="high" />
    </div>

    <!-- ── Login Card ── -->
    <div class="login-card">

      <div class="login-heading">Welcome to <strong>AAKAAR</strong></div>
      <div class="login-sub">Enter your details to continue</div>

      <form id="login-form" onsubmit="handleLogin(event)">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="" />
        </div>

        <button type="submit" class="login-cta">Continue the journey</button>

      </form>

      <!-- Divider -->
      <div class="login-divider">
        <div class="login-divider-line"></div>
        <div class="login-divider-text">New Here ?</div>
        <div class="login-divider-line"></div>
      </div>

      <!-- Role selection -->
      <div class="login-roles">
        <a href="collector.html" class="role-btn" id="collector-role-btn">
          <div class="role-icon">
            <!-- Collector: plant/leaf icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22V12"/>
              <path d="M5 12c0-4 3-7 7-7 4 0 7 3 7 7-2 0-5-1-7-3-2 2-5 3-7 3z"/>
            </svg>
          </div>
          <span class="role-label">I am a Collector</span>
        </a>
        <a href="artisan.html" class="role-btn" id="creator-role-btn">
          <div class="role-icon">
            <!-- Creator: chisel/craft tool icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
            </svg>
          </div>
          <span class="role-label">I am a Creator</span>
        </a>
      </div>

    </div>

  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return;
      // Route based on simple demo logic — in production this would call an API
      window.location.href = 'collector.html';
    }
  </script>


</body>
</html>
